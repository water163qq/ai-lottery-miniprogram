name: Sync lottery data

on:
  schedule:
    # Daily at 22:50 UTC (06:50 Beijing) after the app repo's own 22:30 run
    - cron: "50 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lottery-data
  cancel-in-progress: false

jobs:
  sync:
    name: Pull latest core modules and commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync core modules from app repo
        run: python3 scripts/sync-from-app-repo.py

      - name: Run mini program tests
        run: node scripts/test-miniprogram.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/livedata.js utils/data.js utils/engine.js
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(data): 同步最新开奖数据与资讯"
          git push
